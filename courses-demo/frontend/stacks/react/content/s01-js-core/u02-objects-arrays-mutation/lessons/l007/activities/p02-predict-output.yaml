id: p02
kind: predict_output
phase: practice
code: |
  const a = { x: { n: 1 } };
  const b = { ...a };
  b.x.n = 2;
  console.log(a.x.n);
question: Что выведет?
choices:
  - id: a
    text: '2'
    correct: true
  - id: b
    text: '1'
  - id: c
    text: 'undefined'
  - id: d
    text: 'TypeError'
explain: |
  `b.x` и `a.x` — одна ссылка; мутация через `b` видна в `a`.
