id: i01
kind: interview_phrasing
phase: phrasing
prompt: |
  Объясните вслух: как JavaScript хранит значения и чем отличаются примитивы от объектов.
rubric: |
  Ожидаемые пункты (30–60 сек):
  - тип у значения, не у переменной; динамическая типизация
  - примитив vs ссылка на object в heap
  - присваивание: копия значения vs копия ссылки
  - один пример (object shared by two variables)
sampleAnswer: |
  В JavaScript тип принадлежит значению. Переменная — это имя для текущего значения.
  Примитивы передаются по значению, объекты — по ссылке: две переменные могут указывать
  на один объект, и мутация через одну видна через другую. Это важно для state и props в React.
