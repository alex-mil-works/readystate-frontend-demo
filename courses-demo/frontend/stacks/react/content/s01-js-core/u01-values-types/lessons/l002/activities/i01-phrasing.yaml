id: i01
kind: interview_phrasing
phase: phrasing
prompt: |
  Объясните вслух: почему `typeof null` возвращает `object`, и как вы обычно проверяете тип значения.
rubric: |
  - упомянуть исторический type tag / bug, не «null — объект по смыслу»
  - перечислить ограничения typeof (array, null)
  - предложить `=== null`, `Array.isArray`, при необходимости `Object.prototype.toString`
sampleAnswer: |
  `typeof null === 'object'` — известный артеfact ранней реализации. На null проверяю строго `value === null`.
  Для массивов — `Array.isArray`. typeof удобен для примитивов и function, но не различает виды object.
