id: p01
kind: single_choice
phase: practice
prompt: |
  Что верно про динамическую типизацию в JavaScript?
options:
  - id: a
    text: Тип объявляется один раз при `let`/`const` и не меняется
  - id: b
    text: Тип принадлежит значению; переменная может ссылаться на значения разных типов
    correct: true
  - id: c
    text: Все значения в JS — объекты, примитивы только синтаксический сахар
  - id: d
    text: TypeScript в runtime запрещает смену типа переменной
explain: |
  В JS тип привязан к **значению**, не к имени. TypeScript проверяет типы на этапе компиляции и стирается в runtime.
