id: p02
kind: single_choice
phase: practice
prompt: |
  После выполнения кода ниже, сколько объектов `{ n: 1 }` лежит в heap (логически)?

  ```js
  const a = { n: 1 };
  const b = a;
  const c = { n: 1 };
  ```
options:
  - id: a
    text: Один — `a` и `b` делят ссылку; `c` — другой объект
    correct: true
  - id: b
    text: Три — каждая переменная создаёт копию
  - id: c
    text: Два — `c` ссылается на тот же объект, что и `a`
  - id: d
    text: Ноль — объекты только в stack
explain: |
  `b = a` копирует ссылку. `c = { n: 1 }` создаёт **новый** объект с тем же содержимым, но другой identity.
