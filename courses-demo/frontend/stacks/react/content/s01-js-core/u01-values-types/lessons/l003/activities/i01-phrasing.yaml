id: i01
kind: interview_phrasing
phase: phrasing
prompt: |
  Объясните вслух: в чём разница между `==`, `===` и `Object.is` — с коротким примером.
rubric: |
  - coercion только у ==
  - пример с типами или null/undefined
  - NaN и +0/-0 для Object.is
  - рекомендация === в коде по умолчанию
sampleAnswer: |
  `===` сравнивает без приведения типов. `==` может приводить, например `'5' == 5`.
  `Object.is` как `===`, но NaN равен NaN и +0 отличается от -0. В коде использую `===`,
  кроме узких случаев вроде `value == null`.
