id: p02
kind: single_choice
phase: practice
prompt: |
  Что замыкание захватывает — значение или ссылку на binding?
options:
  - id: a
    text: Копию значения на момент создания функции
  - id: b
    text: Ссылку на binding — если переменная изменится, замыкание увидит новое значение
    correct: true
  - id: c
    text: И копию, и ссылку — зависит от типа переменной
  - id: d
    text: Только примитивы по значению, объекты по ссылке
explain: |
  Замыкание всегда захватывает ссылку на переменную (binding), независимо от типа значения. Если значение меняется после создания замыкания, внутренняя функция увидит изменение.
