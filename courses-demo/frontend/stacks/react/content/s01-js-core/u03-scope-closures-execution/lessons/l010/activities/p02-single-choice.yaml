id: p02
kind: single_choice
phase: practice
prompt: |
  Почему замена `var` на `let` в цикле `for` решает проблему замыкания?
options:
  - id: a
    text: '`let` создаёт новый binding для каждой итерации'
    correct: true
  - id: b
    text: '`let` копирует значение в замыкание'
  - id: c
    text: '`let` запрещает изменение переменной после цикла'
  - id: d
    text: '`let` заставляет setTimeout выполняться синхронно'
explain: |
  Спецификация `for` + `let` создаёт новое лексическое окружение на каждой итерации. Каждое замыкание захватывает свой экземпляр `i`.
