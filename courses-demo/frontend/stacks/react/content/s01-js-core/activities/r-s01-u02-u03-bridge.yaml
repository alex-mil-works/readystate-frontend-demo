id: r-s01-u02-u03-bridge
kind: single_choice
phase: revision
tags: [mutation, closures, scope]
reinforces: [L007, L009]
source: original
prompt: |
  Замыкание захватывает объект из внешнего scope. Внешняя функция мутирует этот объект. Что увидит замыкание?
options:
  - id: a
    text: Изменённый объект — замыкание хранит ссылку на binding, а binding ссылается на тот же объект
    correct: true
  - id: b
    text: Исходный объект — замыкание копирует значение
  - id: c
    text: undefined — объект выходит из scope
  - id: d
    text: Зависит от того, `const` или `let`
explain: |
  Замыкание удерживает ссылку на binding (U03). Binding ссылается на объект в heap. Мутация объекта (U02) видна всем ссылкам на него.
hints:
  - title: U02 → U03
    markdown: |
      U02: объекты хранятся в heap; переменная — ссылка. Мутация через одну ссылку видна через другую.
      U03: замыкание захватывает ссылку на binding, а не копию значения. Объединяя: замыкание + мутация = один и тот же объект.
