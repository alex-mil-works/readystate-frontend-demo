source: original
prompt: |
  `const state = { count: 0 }; state.count++` — ошибка?
options:
  - id: a
    text: Нет — `const` не запрещает мутацию по ссылке; для React нужен immutable update
    correct: true
  - id: b
    text: Да — `const` делает объект frozen
  - id: c
    text: Да — только `let` для полей
