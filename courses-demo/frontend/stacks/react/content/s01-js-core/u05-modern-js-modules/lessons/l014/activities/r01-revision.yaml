id: r01
kind: single_choice
phase: revision
prompt: |
  `const [head, ...tail] = [1, 2, 3]` — чему равен `tail`?
options:
  - id: a
    text: '[2, 3]'
    correct: true
  - id: b
    text: '2'
  - id: c
    text: '[1, 2, 3]'
  - id: d
    text: '3'
explain: |
  Rest в деструктуризации массива собирает оставшиеся элементы в настоящий массив.
hints:
  - title: Rest в деструктуризации
    markdown: |
      `...tail` собирает все элементы после `head` в новый массив. Rest должен быть последним.
  - title: Spread vs rest
    markdown: |
      **Spread** (`...arr`) — раскладывает. **Rest** (`...args`) — собирает. Один оператор, два направления.
