id: i01
kind: interview_phrasing
phase: phrasing
prompt: |
  Объясните вслух: деструктуризация, rest и spread — с примерами для массивов и объектов.
rubric: |
  - массив: [a, b] = arr, пропуск, rest
  - объект: { name } = obj, переименование, default
  - spread для копирования (shallow) и слияния
  - rest в параметрах функции
sampleAnswer: |
  Деструктуризация извлекает значения из массивов и объектов в отдельные переменные.
  Для массивов: `[a, , c] = arr` — позиционная разборка, можно пропускать. Для объектов:
  `{ name: n, age = 25 } = obj` — по ключу, с переименованием и defaults. Rest (`...rest`)
  собирает остаток в массив или объект. Spread (`...arr`) раскладывает iterable — для
  копирования, слияния массивов и объектов. Spread — shallow copy.
