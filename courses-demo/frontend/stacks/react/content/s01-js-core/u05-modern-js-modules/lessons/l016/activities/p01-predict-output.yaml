id: p01
kind: predict_output
phase: practice
code: |
  class Animal {
    constructor(name) { this.name = name; }
  }
  class Dog extends Animal {
    constructor(name) { super(name); }
    speak() { return `${this.name} barks`; }
  }
  const d = new Dog('Rex');
  console.log(d instanceof Animal);
question: Что выведет?
choices:
  - id: a
    text: 'true'
    correct: true
  - id: b
    text: 'false'
  - id: c
    text: TypeError
  - id: d
    text: undefined
explain: |
  `Dog extends Animal` — `d` наследует через prototype chain. `instanceof` проходит по цепочке прототипов.
