id: i01
kind: interview_phrasing
phase: phrasing
prompt: |
  Объясните вслух: как Jackson помогает в API-автотестах.
rubric: |
  - ObjectMapper
  - DTO/record
  - @JsonProperty / unknown props
sampleAnswer: |
  ObjectMapper мапит JSON в DTO. Record уменьшает boilerplate. @JsonProperty стыкует имена; строгий режим ловит лишние поля — полезно держать контракт API под контролем.
