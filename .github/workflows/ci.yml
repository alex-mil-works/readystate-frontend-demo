name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Demo build flags: Repository Variables (Settings → Variables).
env:
  CONTENT_SOURCE: ${{ vars.CONTENT_SOURCE }}
  VITE_CONTENT_SOURCE: ${{ vars.VITE_CONTENT_SOURCE }}
  VITE_DEMO: ${{ vars.VITE_DEMO }}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Oxlint
        run: yarn lint

      - name: Prettier
        run: yarn format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript
        run: yarn typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Vitest
        run: yarn test:run

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      VITE_SITE_PASSWORD: ${{ secrets.VITE_SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright Chromium
        run: yarn exec playwright install chromium --with-deps

      - name: Compile demo content
        run: yarn content:compile:demo

      - name: Playwright smoke
        run: yarn test:e2e
        env:
          VITE_SITE_PASSWORD: ${{ secrets.VITE_SITE_PASSWORD }}

  build:
    name: Build (demo)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, e2e]
    env:
      VITE_SITE_PASSWORD: ${{ secrets.VITE_SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile demo content
        run: yarn content:compile:demo

      - name: Build
        run: yarn build
        env:
          CONTENT_SOURCE: demo
          VITE_CONTENT_SOURCE: demo
          VITE_DEMO: 'true'
          VITE_SITE_PASSWORD: ${{ secrets.VITE_SITE_PASSWORD }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Vercel (approval)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_SITE_PASSWORD: ${{ secrets.VITE_SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID secret is empty"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID secret is empty"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret is empty"; exit 1; }
          echo "VERCEL_ORG_ID length: ${#VERCEL_ORG_ID}"
          echo "VERCEL_PROJECT_ID length: ${#VERCEL_PROJECT_ID}"

      - name: Verify Vercel API access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          if [ "$status" != "200" ]; then
            echo "::error::Vercel API returned HTTP $status for project lookup."
            echo "Check VERCEL_TOKEN (full account token), VERCEL_ORG_ID (team_…), VERCEL_PROJECT_ID (prj_…)."
            echo "If secrets exist under Environment → Production, they override repository secrets."
            cat /tmp/vercel-project.json || true
            exit 1
          fi
          echo "Vercel project accessible."

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Drop env files from Vercel (GitHub is source of truth)
        run: rm -f .vercel/.env.preview.local .vercel/.env.production.local .vercel/.env.local .vercel/.env.development.local

      - name: Verify Vercel link
        run: test -f .vercel/project.json

      - name: Compile demo content
        run: yarn content:compile:demo

      - name: Verify compiled bundles
        run: test -f src/shared/content/generated/frontend/react/course.json

      - name: Build for Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CONTENT_SOURCE: demo
          VITE_CONTENT_SOURCE: demo
          VITE_DEMO: 'true'
          VITE_SITE_PASSWORD: ${{ secrets.VITE_SITE_PASSWORD }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Summary
        run: |
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
